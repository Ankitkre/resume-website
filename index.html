<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ankit | Resume</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   CSS VARIABLES
========================= */

:root{
  --primary:#e39d3c;
  --primary-dark:#cf872a;
  --text:#222;
  --muted:#666;
  --background:#f8f9fb;
  --white:#ffffff;
}


/* =========================
   UNIVERSAL SELECTOR
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


/* =========================
   SMOOTH SCROLL
========================= */

html{
  scroll-behavior:smooth;
}


/* =========================
   BODY
========================= */

body{
  font-family:'Poppins',sans-serif;
  background:var(--background);
  color:var(--text);
  line-height:1.6;
}


/* =========================
   NAVIGATION BAR
========================= */

nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:rgba(255,255,255,0.96);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 60px;
  box-shadow:0 2px 15px rgba(0,0,0,0.05);
  z-index:1000;
  backdrop-filter:blur(8px);
}

nav h2{
  font-weight:600;
  color:var(--text);
}

nav ul{
  list-style:none;
  display:flex;
  gap:30px;
  align-items:center;
}

nav a{
  text-decoration:none;
  color:#333;
  font-weight:500;
  position:relative;
  transition:color 0.3s ease;
}

nav a:hover{
  color:var(--primary);
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-5px;
  width:0;
  height:2px;
  background:var(--primary);
  transition:width 0.3s ease;
}

nav a:hover::after{
  width:100%;
}


/* =========================
   HERO SECTION
========================= */

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:120px 20px 80px;
  text-align:center;
}

.hero-content{
  max-width:750px;
}

.hero img{
  width:160px;
  height:160px;
  border-radius:50%;
  object-fit:cover;
  margin:25px 0;
  border:4px solid white;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  transition:transform 0.3s ease;
}

.hero img:hover{
  transform:scale(1.05);
}

.hero h1{
  font-size:48px;
  font-weight:700;
  line-height:1.2;
}

.highlight{
  color:var(--primary);
}

.hero p{
  margin:20px 0;
  font-size:18px;
  color:#555;
}


/* =========================
   BUTTONS
========================= */

.btn{
  display:inline-block;
  padding:12px 28px;
  background:var(--primary);
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:600;
  transition:transform 0.3s ease,
             background 0.3s ease,
             box-shadow 0.3s ease;
}

.btn:hover{
  background:var(--primary-dark);
  transform:translateY(-3px);
  box-shadow:0 8px 18px rgba(0,0,0,0.12);
}


/* =========================
   SECTIONS
========================= */

section{
  padding:100px 60px;
}

section h2{
  text-align:center;
  font-size:34px;
  margin-bottom:40px;
  position:relative;
}

section h2::after{
  content:"";
  display:block;
  width:50px;
  height:3px;
  background:var(--primary);
  margin:12px auto 0;
  border-radius:5px;
}


/* =========================
   ABOUT SECTION
========================= */

.about-text{
  max-width:750px;
  margin:auto;
  text-align:center;
  color:var(--muted);
  font-size:16px;
}


/* =========================
   SKILLS
========================= */

.skills{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
}

.skill-pill{
  background:white;
  padding:10px 20px;
  border-radius:30px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
  transition:transform 0.3s ease,
             box-shadow 0.3s ease;
}

.skill-pill:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 20px rgba(0,0,0,0.09);
}


/* =========================
   CARDS
========================= */

.card-container{
  display:flex;
  flex-wrap:wrap;
  gap:30px;
  justify-content:center;
}

.card{
  background:white;
  width:280px;
  padding:25px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.06);
  transition:transform 0.3s ease,
             box-shadow 0.3s ease;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 15px 30px rgba(0,0,0,0.10);
}

.card h3{
  margin-bottom:10px;
  font-size:18px;
}

.card p{
  color:var(--muted);
  font-size:14px;
}


/* =========================
   CONTACT SECTION
========================= */

.contact-card{
  max-width:700px;
  margin:auto;
  background:white;
  padding:40px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.06);
}

.contact-card p{
  color:var(--muted);
  margin-bottom:25px;
}

.contact-links{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.secondary-btn{
  background:#222;
}

.secondary-btn:hover{
  background:#444;
}


/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:30px;
  background:white;
  color:#777;
  font-size:14px;
}


/* =========================
   RESPONSIVE DESIGN
========================= */

@media (max-width:768px){

  /* Navigation */

  nav{
    padding:15px 20px;
    flex-direction:column;
    gap:12px;
  }

  nav h2{
    font-size:20px;
  }

  nav ul{
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }

  nav a{
    font-size:13px;
  }


  /* Hero */

  .hero{
    min-height:100vh;
    padding:160px 20px 80px;
  }

  .hero h1{
    font-size:36px;
  }

  .hero p{
    font-size:16px;
  }

  .hero img{
    width:130px;
    height:130px;
  }


  /* Sections */

  section{
    padding:70px 20px;
  }

  section h2{
    font-size:28px;
  }


  /* Cards */

  .card{
    width:100%;
    max-width:400px;
  }


  /* Contact */

  .contact-card{
    padding:30px 20px;
  }

}


/* =========================
   EXTRA SMALL DEVICES
========================= */

@media (max-width:480px){

  nav ul{
    gap:8px;
  }

  nav a{
    font-size:11px;
  }

  .hero h1{
    font-size:30px;
  }

  .hero p{
    font-size:14px;
  }

  .btn{
    padding:10px 22px;
    font-size:14px;
  }

  .skill-pill{
    font-size:14px;
  }

}

</style>
</head>
